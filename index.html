<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>AutoTrade</title>
<style>
:root {
  --header: #0f172a;
  --bg: #f1f5f9;
  --card: #ffffff;
  --primary: #1e40af;
  --primary-light: #3b82f6;
  --success: #059669;
  --danger: #dc2626;
  --warning: #d97706;
  --text: #0f172a;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
body { padding-bottom: calc(68px + var(--safe-bottom)); }

.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--header); color: #fff;
  padding: 12px 16px 14px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
.header h1 span { color: #38bdf8; }
.header-rate {
  display: flex; align-items: center; gap: 4px;
  background: rgba(255,255,255,.12); border-radius: 20px;
  padding: 6px 12px; font-size: .85rem; cursor: pointer;
  border: none; color: #fff;
}
.header-rate .pencil { opacity: .7; font-size: .75rem; margin-left: 2px; }

.screen { display: none; padding: 16px; min-height: calc(100vh - 130px); animation: fadeIn .2s ease; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.card {
  background: var(--card); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.card-title { font-size: .72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.card-value { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.02em; }
.card-sub { font-size: .85rem; color: var(--text-secondary); margin-top: 2px; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.card-grid .card { margin-bottom: 0; }
.positive { color: var(--success); }
.negative { color: var(--danger); }

.capital-card {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
  color: #fff; border: none; border-radius: 18px; padding: 18px 16px;
  margin-bottom: 12px;
}
.capital-card .card-title { color: rgba(255,255,255,.65); }
.capital-card .card-sub { color: #38bdf8; }

.debt-card {
  background: #fef2f2; border: 1px solid #fecaca; border-left: 4px solid #dc2626;
  border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
}
.debt-card .card-title { color: #dc2626; }
.debt-card .card-value { color: #dc2626; font-size: 1.35rem; }
.debt-card .card-sub { color: #b91c1c; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-btn {
  flex-shrink: 0; padding: 8px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--card);
  font-size: .82rem; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; transition: all .15s;
}
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.list-item {
  background: var(--card); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.list-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.list-item-title { font-weight: 700; font-size: 1.05rem; }
.list-item-meta { font-size: .78rem; color: var(--text-secondary); margin-top: 3px; }
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 4px 10px; border-radius: 10px; font-size: .7rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
}
.badge-way { background: #fef3c7; color: #b45309; }
.badge-stock { background: #d1fae5; color: #065f46; }
.badge-sold { background: #e0e7ff; color: #3730a3; }

.finance-box {
  background: #f8fafc; border-radius: 12px; padding: 12px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px;
  margin-bottom: 10px; font-size: .82rem;
}
.finance-box .fl { color: var(--text-secondary); }
.finance-box .fv { font-weight: 600; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 9px 14px; border-radius: 12px; border: none;
  font-size: .82rem; font-weight: 600; cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97); opacity: .9; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
.btn-sm { padding: 7px 11px; font-size: .78rem; border-radius: 10px; }
.btn-block { width: 100%; padding: 13px; font-size: .95rem; margin-top: 6px; border-radius: 14px; }
.btn-ghost { background: transparent; border: 1.5px dashed var(--border); color: var(--text-secondary); }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-secondary); }
.empty-state .icon { font-size: 2.8rem; margin-bottom: 12px; opacity: .45; }

.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--card); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around;
  padding: 6px 0 calc(6px + var(--safe-bottom));
  box-shadow: 0 -2px 12px rgba(0,0,0,.06);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 6px 2px; background: none; border: none;
  color: var(--text-secondary); font-size: .68rem; font-weight: 500;
  cursor: pointer; transition: color .15s;
}
.nav-item.active { color: var(--primary); }
.nav-item .icon { font-size: 1.3rem; line-height: 1; }

.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(15,23,42,.5); display: none;
  align-items: flex-end; justify-content: center;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); width: 100%; max-width: 480px;
  border-radius: 20px 20px 0 0; max-height: 90vh;
  overflow-y: auto; padding: 20px 16px calc(24px + var(--safe-bottom));
  animation: slideUp .28s ease;
  -webkit-overflow-scrolling: touch;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-header h2 { font-size: 1.15rem; font-weight: 700; }
.modal-close {
  width: 34px; height: 34px; border-radius: 50%; border: none;
  background: var(--bg); font-size: 1.25rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
}
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: .78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border);
  border-radius: 12px; font-size: 1rem; background: #fff;
  outline: none; transition: border-color .15s; -webkit-appearance: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-actions { display: flex; gap: 10px; margin-top: 10px; }
.form-actions .btn { flex: 1; padding: 13px; border-radius: 12px; }

.stat-row { display: flex; gap: 8px; margin-bottom: 14px; }
.stat-chip {
  flex: 1; background: #f1f5f9; border-radius: 12px;
  padding: 12px 8px; text-align: center;
}
.stat-chip .num { font-size: 1.25rem; font-weight: 700; }
.stat-chip .lbl { font-size: .72rem; color: var(--text-secondary); margin-top: 2px; }

.section-title {
  font-size: .78rem; font-weight: 700; margin: 18px 0 10px;
  color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em;
}

.schedule-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.schedule-item:last-child { border-bottom: none; }
.paid { text-decoration: line-through; color: var(--text-secondary); }

.supplier-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.supplier-item:last-child { border-bottom: none; }

.hidden { display: none !important; }
.mt-8 { margin-top: 8px; }
.mb-8 { margin-bottom: 8px; }
.text-sm { font-size: .85rem; }
.text-muted { color: var(--text-secondary); }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>

<header class="header">
  <h1>Auto<span>Trade</span></h1>
  <button class="header-rate" onclick="openRateModal()" id="rateBtn">
    1 $ = <strong id="rateDisplay">90.0</strong> ₽ <span class="pencil">✏️</span>
  </button>
</header>

<section id="screen-summary" class="screen active">
  <div class="capital-card">
    <div class="card-title">Чистый капитал (активы − долги)</div>
    <div class="card-value" id="netCapitalRub">0 ₽</div>
    <div class="card-sub" id="netCapitalUsd">$ 0</div>
  </div>

  <div class="card-grid">
    <div class="card">
      <div class="card-title">В машинах и товарах</div>
      <div class="card-value" style="font-size:1.2rem" id="frozenRub">0 ₽</div>
      <div class="card-sub" id="frozenUsd">$ 0</div>
    </div>
    <div class="card">
      <div class="card-title">Чистая прибыль</div>
      <div class="card-value positive" style="font-size:1.2rem" id="totalProfitRub">0 ₽</div>
      <div class="card-sub positive" id="totalProfitUsd">$ 0</div>
    </div>
  </div>

  <div class="debt-card">
    <div class="card-title">Мои долги к возврату</div>
    <div class="card-value" id="totalDebtsRub">0 ₽</div>
    <div class="card-sub" id="totalDebtsUsd">$ 0</div>
  </div>

  <div class="card">
    <div class="card-title">Статус авто в работе</div>
    <div class="stat-row" style="margin:10px 0 0">
      <div class="stat-chip">
        <div class="num" id="carsInTransit">0</div>
        <div class="lbl">🚚 В пути</div>
      </div>
      <div class="stat-chip">
        <div class="num" id="carsInStock">0</div>
        <div class="lbl">📍 В наличии</div>
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="openCarModal()">+ Добавить автомобиль</button>
  </div>
</section>

<section id="screen-cars" class="screen">
  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="filterCars('all')">Все</button>
    <button class="filter-btn" data-filter="transit" onclick="filterCars('transit')">В пути</button>
    <button class="filter-btn" data-filter="stock" onclick="filterCars('stock')">В наличии</button>
    <button class="filter-btn" data-filter="sold" onclick="filterCars('sold')">Проданы</button>
  </div>
  <div id="carsList"></div>
  <button class="btn btn-primary btn-block" onclick="openCarModal()">+ Добавить авто</button>
</section>

<section id="screen-goods" class="screen">
  <div id="goodsList"></div>
  <button class="btn btn-primary btn-block" onclick="openGoodModal()">+ Добавить товар</button>
</section>

<section id="screen-debts" class="screen">
  <div id="debtsList"></div>
  <button class="btn btn-primary btn-block" onclick="openDebtModal()">+ Записать долг</button>
</section>

<section id="screen-more" class="screen">
  <div class="card">
    <div class="card-title">Справочник поставщиков (Киргизия)</div>
    <div id="suppliersList"></div>
    <button class="btn btn-ghost btn-block" onclick="openSupplierModal()">+ Добавить поставщика</button>
  </div>

  <div class="section-title">Исламская рассрочка (Мурабаха)</div>
  <div id="murabahaList"></div>
  <button class="btn btn-ghost btn-block" onclick="openMurabahaModal()">+ Новая сделка мурабаха</button>

  <div class="section-title">Данные и резервные копии</div>
  <div class="card">
    <button class="btn btn-outline btn-block" onclick="exportData()">💾 Скачать резервную копию (JSON)</button>
    <button class="btn btn-outline btn-block" onclick="document.getElementById('importFile').click()">📥 Загрузить резервную копию</button>
    <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
    <button class="btn btn-outline btn-block" style="color:#dc2626;border-color:#fecaca;background:#fef2f2" onclick="resetAndLoadDemo()">🔄 Сбросить и загрузить демо-данные</button>
    <button class="btn btn-danger btn-block" onclick="clearAllData()">🗑️ Очистить все данные</button>
  </div>
</section>

<nav class="bottom-nav">
  <button class="nav-item active" data-screen="summary" onclick="showScreen('summary')">
    <span class="icon">📊</span><span>Сводка</span>
  </button>
  <button class="nav-item" data-screen="cars" onclick="showScreen('cars')">
    <span class="icon">🚗</span><span>Машины</span>
  </button>
  <button class="nav-item" data-screen="goods" onclick="showScreen('goods')">
    <span class="icon">📱</span><span>Товары</span>
  </button>
  <button class="nav-item" data-screen="debts" onclick="showScreen('debts')">
    <span class="icon">💵</span><span>Долги</span>
  </button>
  <button class="nav-item" data-screen="more" onclick="showScreen('more')">
    <span class="icon">⚙️</span><span>Ещё</span>
  </button>
</nav>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfOverlay(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const STORAGE_KEY = 'autotrade_v2';

const defaultData = () => ({
  settings: { usdRate: 90.0 },
  suppliers: [],
  cars: [],
  goods: [],
  debts: [],
  murabaha: []
});

let db = defaultData();

function loadDB() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      db = { ...defaultData(), ...parsed };
      if (!db.settings) db.settings = { usdRate: 90 };
      ['suppliers','cars','goods','debts','murabaha'].forEach(k => {
        if (!Array.isArray(db[k])) db[k] = [];
      });
    }
  } catch (e) {
    db = defaultData();
  }
  updateRateDisplay();
}

function saveDB() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function fmt(n, dec = 0) {
  return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: dec, minimumFractionDigits: dec });
}

function toRub(amount, currency, rate) {
  if (currency === 'USD') return (amount || 0) * (rate || db.settings.usdRate);
  return amount || 0;
}

function updateRateDisplay() {
  const r = db.settings.usdRate;
  document.getElementById('rateDisplay').textContent = Number(r).toFixed(1);
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.screen === name);
  });
  if (name === 'summary') renderSummary();
  if (name === 'cars') renderCars();
  if (name === 'goods') renderGoods();
  if (name === 'debts') renderDebts();
  if (name === 'more') { renderSuppliers(); renderMurabaha(); }
}

function openRateModal() {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <h2>Курс доллара</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label>1 $ = ? ₽</label>
      <input type="number" id="rateInput" value="${db.settings.usdRate}" step="0.1" min="1" inputmode="decimal">
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveRate()">Сохранить</button>
    </div>`;
  openModal();
  setTimeout(() => document.getElementById('rateInput')?.focus(), 100);
}

function saveRate() {
  const v = parseFloat(document.getElementById('rateInput').value);
  if (!v || v < 1) { alert('Введите корректный курс'); return; }
  db.settings.usdRate = v;
  saveDB();
  updateRateDisplay();
  closeModal();
  renderAll();
}

function carCostRub(car) {
  let cost = car.purchaseRub || 0;
  (car.expenses || []).forEach(e => {
    cost += toRub(e.amount, e.currency, e.rate || db.settings.usdRate);
  });
  return cost;
}

function carProfitRub(car) {
  if (car.status !== 'sold' || !car.salePriceRub) return 0;
  return car.salePriceRub - carCostRub(car);
}

function getTotals() {
  const rate = db.settings.usdRate || 90;
  let frozenRub = 0, profitRub = 0;
  let transit = 0, stock = 0, sold = 0;

  db.cars.forEach(c => {
    if (c.status === 'transit') { transit++; frozenRub += carCostRub(c); }
    else if (c.status === 'stock') { stock++; frozenRub += carCostRub(c); }
    else if (c.status === 'sold') { sold++; profitRub += carProfitRub(c); }
  });

  db.goods.forEach(g => {
    if (g.status === 'stock') frozenRub += (g.purchasePrice || 0);
    else if (g.status === 'sold') profitRub += ((g.salePrice || 0) - (g.purchasePrice || 0));
  });

  let debtsRub = 0, debtsUsd = 0;
  db.debts.forEach(d => {
    if (d.currency === 'USD') {
      debtsUsd += d.amount;
      debtsRub += d.amount * rate;
    } else {
      debtsRub += d.amount;
      debtsUsd += d.amount / rate;
    }
  });

  const netCapitalRub = frozenRub + profitRub - debtsRub;
  return {
    frozenRub, frozenUsd: frozenRub / rate,
    profitRub, profitUsd: profitRub / rate,
    debtsRub, debtsUsd,
    netCapitalRub, netCapitalUsd: netCapitalRub / rate,
    transit, stock, sold
  };
}

function renderSummary() {
  const t = getTotals();
  document.getElementById('netCapitalRub').textContent = fmt(t.netCapitalRub) + ' ₽';
  document.getElementById('netCapitalUsd').textContent = '$ ' + fmt(t.netCapitalUsd, 0);
  document.getElementById('frozenRub').textContent = fmt(t.frozenRub) + ' ₽';
  document.getElementById('frozenUsd').textContent = '$ ' + fmt(t.frozenUsd, 0);
  document.getElementById('totalProfitRub').textContent = (t.profitRub >= 0 ? '+' : '') + fmt(t.profitRub) + ' ₽';
  document.getElementById('totalProfitUsd').textContent = (t.profitUsd >= 0 ? '+$' : '-$') + ' ' + fmt(Math.abs(t.profitUsd), 0);
  document.getElementById('totalDebtsRub').textContent = fmt(t.debtsRub) + ' ₽';
  document.getElementById('totalDebtsUsd').textContent = '$ ' + fmt(t.debtsUsd, 0);
  document.getElementById('carsInTransit').textContent = t.transit;
  document.getElementById('carsInStock').textContent = t.stock;
}

let carFilter = 'all';

function filterCars(f) {
  carFilter = f;
  document.querySelectorAll('#screen-cars .filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
  renderCars();
}

function renderCars() {
  const list = document.getElementById('carsList');
  let cars = db.cars.slice().reverse();
  if (carFilter !== 'all') cars = cars.filter(c => c.status === carFilter);

  if (!cars.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🚗</div>Нет автомобилей<br><span class="text-sm">Нажмите «+ Добавить авто»</span></div>';
    return;
  }

  list.innerHTML = cars.map(c => {
    const cost = carCostRub(c);
    const profit = carProfitRub(c);
    const supplier = db.suppliers.find(s => s.id === c.supplierId);
    const expSum = (c.expenses || []).reduce((s, e) => s + toRub(e.amount, e.currency, e.rate), 0);

    const statusBadge = c.status === 'transit'
      ? '<span class="badge badge-way">В пути</span>'
      : c.status === 'stock'
      ? '<span class="badge badge-stock">В наличии</span>'
      : '<span class="badge badge-sold">Продано</span>';

    let finance = `
      <div class="finance-box">
        <div><div class="fl">Закупка</div><div class="fv">$${fmt(c.purchaseUsd, 0)}<br><span class="text-muted">(${fmt(c.purchaseRub)} ₽)</span></div></div>
        <div><div class="fl">Расходы</div><div class="fv">${fmt(expSum)} ₽</div></div>
        <div><div class="fl">Себестоимость</div><div class="fv">${fmt(cost)} ₽</div></div>
        <div><div class="fl">Курс закупки</div><div class="fv">${c.purchaseRate || '—'} ₽</div></div>
      </div>`;

    if (c.status === 'sold') {
      finance += `
        <div class="finance-box" style="background:#f0fdf4">
          <div><div class="fl">Продажа</div><div class="fv">${fmt(c.salePriceRub)} ₽</div></div>
          <div><div class="fl">Прибыль</div><div class="fv ${profit >= 0 ? 'positive' : 'negative'}">${profit >= 0 ? '+' : ''}${fmt(profit)} ₽</div></div>
          <div style="grid-column:1/-1"><div class="fl">Покупатель</div><div class="fv">${c.buyerName || '—'} ${c.buyerPhone ? '· ' + c.buyerPhone : ''}</div></div>
        </div>`;
    }

    let actions = `<div class="actions">`;
    if (c.status !== 'sold') {
      actions += `<button class="btn btn-outline btn-sm" onclick="openExpenseModal('${c.id}')">+ Расход</button>`;
      if (c.status === 'transit') {
        actions += `<button class="btn btn-outline btn-sm" onclick="setCarStatus('${c.id}','stock')">📍 Прибыла в РФ</button>`;
      }
      actions += `<button class="btn btn-primary btn-sm" onclick="openSellModal('${c.id}')">💰 Продать</button>`;
    }
    actions += `<button class="btn btn-outline btn-sm" onclick="openCarModal('${c.id}')">✏️ Ред.</button>`;
    actions += `<button class="btn btn-danger btn-sm" onclick="deleteCar('${c.id}')">🗑️</button></div>`;

    return `<div class="list-item">
      <div class="list-item-header">
        <div>
          <div class="list-item-title">${c.brand} ${c.model}${c.year ? ' (' + c.year + ')' : ''}</div>
          <div class="list-item-meta">VIN: ${c.vin || '—'} · ${supplier ? supplier.name + (supplier.city ? ' (' + supplier.city + ')' : '') : '—'}</div>
          ${c.color || c.mileage || c.plate ? `<div class="list-item-meta">${[c.color, c.mileage ? fmt(c.mileage) + ' км' : '', c.plate].filter(Boolean).join(' · ')}</div>` : ''}
        </div>
        ${statusBadge}
      </div>
      ${finance}
      ${actions}
    </div>`;
  }).join('');
}

function openCarModal(id) {

    <div class="form-row">

      <div class="form-group"><label>Цвет</label><input id="c_color" value="${esc(car?.color)}" placeholder="Белый"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Пробег (км)</label><input type="number" id="c_mileage" value="${car?.mileage || ''}" inputmode="numeric"></div>

        <option value="transit" ${!car || car.status === 'transit' ? 'selected' : ''}>В пути</option>
        <option value="stock" ${car?.status === 'stock' ? 'selected' : ''}>В наличии</option>
        <option value="sold" ${car?.status === 'sold' ? 'selected' : ''}>Продана</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Закупка ($)*</label><input type="number" id="c_purchaseUsd" value="${car?.purchaseUsd || ''}" step="0.01" inputmode="decimal" oninput="calcPurchaseRub()"></div>
      <div class="form-group"><label>Курс на день покупки</label><input type="number" id="c_purchaseRate" value="${car?.purchaseRate || db.settings.usdRate}" step="0.1" inputmode="decimal" oninput="calcPurchaseRub()"></div>
    </div>
    <div class="form-group"><label>Закупка (₽) — авто</label><input type="number" id="c_purchaseRub" value="${car?.purchaseRub || ''}" readonly style="background:#f8fafc"></div>
    ${car && (car.expenses || []).length ? `
      <div class="form-group"><label>Расходы (можно удалить)</label>
        <div id="expList">${(car.expenses || []).map((e, i) =>
          `<div class="flex-between" style="padding:6px 0;border-bottom:1px solid #eee">
            <span class="text-sm">${e.name}: ${e.currency === 'USD' ? '$' + e.amount : fmt(e.amount) + ' ₽'}</span>
            <button class="btn btn-danger btn-sm" onclick="removeExpense('${id}',${i})">×</button>
          </div>`).join('')}</div>
      </div>` : ''}
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveCar('${id || ''}')">Сохранить</button>
    </div>`;
  openModal();
  if (!car) calcPurchaseRub();
}

function esc(s) { return (s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function calcPurchaseRub() {
  const usd = parseFloat(document.getElementById('c_purchaseUsd')?.value) || 0;
  const rate = parseFloat(document.getElementById('c_purchaseRate')?.value) || db.settings.usdRate;
  const el = document.getElementById('c_purchaseRub');
  if (el) el.value = Math.round(usd * rate);
}

function saveCar(id) {
  const brand = document.getElementById('c_brand').value.trim();
  const model = document.getElementById('c_model').value.trim();
  if (!brand || !model) { alert('Укажите марку и модель'); return; }

  const data = {
    brand, model,
    year: parseInt(document.getElementById('c_year').value) || null,
    color: document.getElementById('c_color').value.trim(),
    mileage: parseInt(document.getElementById('c_mileage').value) || null,
    plate: document.getElementById('c_plate').value.trim(),
    vin: document.getElementById('c_vin').value.trim(),
    supplierId: document.getElementById('c_supplier').value || null,
    status: document.getElementById('c_status').value,
    purchaseUsd: parseFloat(document.getElementById('c_purchaseUsd').value) || 0,
    purchaseRate: parseFloat(document.getElementById('c_purchaseRate').value) || db.settings.usdRate,
    purchaseRub: parseFloat(document.getElementById('c_purchaseRub').value) || 0
  };

  if (id) {
    const idx = db.cars.findIndex(c => c.id === id);
    if (idx >= 0) {
      const old = db.cars[idx];
      data.id = id;
      data.expenses = old.expenses || [];
      data.salePriceRub = old.salePriceRub;
      data.saleUsd = old.saleUsd;
      data.saleRate = old.saleRate;
      data.buyerName = old.buyerName;
      data.buyerPhone = old.buyerPhone;
      db.cars[idx] = data;
    }
  } else {
    data.id = uid();
    data.expenses = [];
    db.cars.push(data);
  }
  saveDB();
  closeModal();
  renderAll();
}

function removeExpense(carId, idx) {
  const car = db.cars.find(c => c.id === carId);
  if (car && car.expenses) {
    car.expenses.splice(idx, 1);
    saveDB();
    openCarModal(carId);
  }
}

function setCarStatus(id, status) {
  const car = db.cars.find(c => c.id === id);
  if (car) { car.status = status; saveDB(); renderAll(); }
}

function deleteCar(id) {
  if (!confirm('Удалить автомобиль безвозвратно?')) return;
  db.cars = db.cars.filter(c => c.id !== id);
  saveDB();
  renderAll();
}

function openExpenseModal(carId) {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <h2>Добавить расход</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group"><label>Название *</label><input id="e_name" placeholder="Перегон / Ремонт / Таможня / Комиссия"></div>
    <div class="form-row">
      <div class="form-group"><label>Сумма *</label><input type="number" id="e_amount" step="0.01" inputmode="decimal"></div>
      <div class="form-group"><label>Валюта</label>
        <select id="e_currency"><option value="RUB">₽ Рубли</option><option value="USD">$ Доллары</option></select>
      </div>
    </div>
    <div class="form-group"><label>Курс (если $)</label><input type="number" id="e_rate" value="${db.settings.usdRate}" step="0.1" inputmode="decimal"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveExpense('${carId}')">Добавить</button>
    </div>`;

}

function saveExpense(carId) {
  const car = db.cars.find(c => c.id === carId);
  if (!car) return;
  const name = document.getElementById('e_name').value.trim();
  const amount = parseFloat(document.getElementById('e_amount').value) || 0;
  if (!name || amount <= 0) { alert('Заполните название и сумму'); return; }
  if (!car.expenses) car.expenses = [];
  car.expenses.push({
    id: uid(), name, amount,
    currency: document.getElementById('e_currency').value,
    rate: parseFloat(document.getElementById('e_rate').value) || db.settings.usdRate
  });
  saveDB();
  closeModal();
  renderAll();
}

function openSellModal(carId) {
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <h2>Продать авто</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group"><label>Цена продажи (₽) *</label><input type="number" id="s_price" inputmode="decimal" oninput="calcSaleUsd()"></div>
    <div class="form-group"><label>Курс на день продажи</label><input type="number" id="s_rate" value="${db.settings.usdRate}" step="0.1" inputmode="decimal" oninput="calcSaleUsd()"></div>
    <div class="form-group"><label>Цена в $ (авто)</label><input type="number" id="s_usd" readonly style="background:#f8fafc"></div>
    <div class="form-group"><label>ФИО покупателя</label><input id="s_buyer"></div>
    <div class="form-group"><label>Телефон</label><input id="s_phone" type="tel" inputmode="tel"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
      <button class="btn btn-success" onclick="saveSale('${carId}')">Продать</button>
    </div>`;
  openModal();
}

function calcSaleUsd() {
  const rub = parseFloat(document.getElementById('s_price')?.value) || 0;
  const rate = parseFloat(document.getElementById('s_rate')?.value) || db.settings.usdRate;
  const el = document.getElementById('s_usd');
  if (el) el.value = rate > 0 ? (rub / rate).toFixed(2) : 0;
}

function saveSale(carId) {
  const car = db.cars.find(c => c.id === carId);
  if (!car) return;
  const price = parseFloat(document.getElementById('s_price').value) || 0;
  if (price <= 0) { alert('Укажите цену продажи'); return; }
  car.salePriceRub = price;
  car.saleRate = parseFloat(document.getElementById('s_rate').value) || db.settings.usdRate;
  car.saleUsd = parseFloat(document.getElementById('s_usd').value) || 0;
  car.buyerName = document.getElementById('s_buyer').value.trim();
  car.buyerPhone = document.getElementById('s_phone').value.trim();
  car.status = 'sold';
  saveDB();
  closeModal();
  renderAll();
}

function confirmSellGood(id) {

function deleteGood(id) {

    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveSupplier('${id || ''}')">Сохранить</button>
    </div>`;
  openModal();
}

function saveSupplier(id) {
  const name = document.getElementById('sup_name').value.trim();
  if (!name) { alert('Укажите название'); return; }
  const data = {
    name,
    city: document.getElementById('sup_city').value,
    phone: document.getElementById('sup_phone').value.trim(),
    note: document.getElementById('sup_note').value.trim()
  };
  if (id) {
    const idx = db.suppliers.findIndex(x => x.id === id);
    if (idx >= 0) { data.id = id; db.suppliers[idx] = data; }
  } else {
    data.id = uid();
    db.suppliers.push(data);
  }
  saveDB();
  closeModal();
  renderSuppliers();
}

function deleteSupplier(id) {
  if (!confirm('Удалить поставщика?')) return;
  db.suppliers = db.suppliers.filter(x => x.id !== id);
  saveDB();
  renderSuppliers();
}

function renderMurabaha() {
  const list = document.getElementById('murabahaList');
  if (!db.murabaha.length) {
    list.innerHTML = '<div class="text-sm text-muted" style="padding:8px 0">Нет сделок</div>';
    return;
  }
  list.innerHTML = db.murabaha.map(m => {
    const totalMarkup = m.price * (m.markupPercent / 100) * m.months;
    const total = m.price + totalMarkup;
    const monthly = m.months > 0 ? (total - m.downPayment) / m.months : 0;
    const paidCount = (m.payments || []).filter(p => p.paid).length;
    return `<div class="list-item">
      <div class="list-item-title">${m.item}</div>
      <div class="list-item-meta">${m.buyer || ''} · ${m.months} мес. · ${m.markupPercent}%/мес</div>
      <div class="finance-box">
        <div><div class="fl">Итого</div><div class="fv">${fmt(total)} ₽</div></div>
        <div><div class="fl">Взнос</div><div class="fv">${fmt(m.downPayment)} ₽</div></div>
        <div><div class="fl">Платёж/мес</div><div class="fv">${fmt(monthly)} ₽</div></div>
        <div><div class="fl">Оплачено</div><div class="fv">${paidCount}/${m.months}</div></div>
      </div>
      <div class="actions">
        <button class="btn btn-outline btn-sm" onclick="showMurabahaSchedule('${m.id}')">📅 График</button>
        <button class="btn btn-success btn-sm" onclick="whatsappMurabaha('${m.id}')">WhatsApp</button>
        <button class="btn btn-outline btn-sm" onclick="openMurabahaModal('${m.id}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMurabaha('${m.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function openMurabahaModal(id) {
  const m = id ? db.murabaha.find(x => x.id === id) : null;
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <h2>${m ? 'Редактировать мурабаха' : 'Новая сделка мурабаха'}</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group"><label>Товар / авто *</label><input id="m_item" value="${esc(m?.item)}" placeholder="Toyota Camry / iPhone 15"></div>
    <div class="form-group"><label>Покупатель</label><input id="m_buyer" value="${esc(m?.buyer)}"></div>
    <div class="form-group"><label>Телефон</label><input id="m_phone" value="${esc(m?.phone)}" type="tel"></div>
    <div class="form-row">
      <div class="form-group"><label>Цена (₽) *</label><input type="number" id="m_price" value="${m?.price || ''}" inputmode="decimal" oninput="calcMurabahaPreview()"></div>
      <div class="form-group"><label>Первый взнос (₽)</label><input type="number" id="m_down" value="${m?.downPayment || ''}" inputmode="decimal" oninput="calcMurabahaPreview()"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Срок (мес)</label><input type="number" id="m_months" value="${m?.months || 6}" min="1" max="12" inputmode="numeric" oninput="calcMurabahaPreview()"></div>
      <div class="form-group"><label>Наценка % / мес</label><input type="number" id="m_markup" value="${m?.markupPercent || 1.5}" step="0.1" inputmode="decimal" oninput="calcMurabahaPreview()"></div>
    </div>
    <div class="card" style="background:#f8fafc;margin-bottom:12px">
      <div class="text-sm text-muted">Предпросмотр</div>
      <div id="m_preview" class="text-sm mt-8">—</div>
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveMurabaha('${id || ''}')">Сохранить</button>
    </div>`;
  openModal();
  calcMurabahaPreview();
}

function calcMurabahaPreview() {
  const price = parseFloat(document.getElementById('m_price')?.value) || 0;
  const down = parseFloat(document.getElementById('m_down')?.value) || 0;
  const months = parseInt(document.getElementById('m_months')?.value) || 1;
  const markup = parseFloat(document.getElementById('m_markup')?.value) || 0;
  const totalMarkup = price * (markup / 100) * months;
  const total = price + totalMarkup;
  const monthly = months > 0 ? (total - down) / months : 0;
  const el = document.getElementById('m_preview');
  if (el) el.innerHTML = `Итого с наценкой: <b>${fmt(total)} ₽</b><br>Платёж в месяц: <b>${fmt(monthly)} ₽</b>`;
}

function saveMurabaha(id) {
  const price = parseFloat(document.getElementById('m_price').value) || 0;
  const months = parseInt(document.getElementById('m_months').value) || 1;
  const item = document.getElementById('m_item').value.trim();
  if (!item || price <= 0) { alert('Укажите товар и цену'); return; }
  const data = {
    item,
    buyer: document.getElementById('m_buyer').value.trim(),
    phone: document.getElementById('m_phone').value.trim(),
    price,
    downPayment: parseFloat(document.getElementById('m_down').value) || 0,
    months,
    markupPercent: parseFloat(document.getElementById('m_markup').value) || 0
  };
  if (id) {
    const idx = db.murabaha.findIndex(x => x.id === id);
    if (idx >= 0) {
      data.id = id;
      let payments = db.murabaha[idx].payments || [];
      while (payments.length < months) payments.push({ paid: false });
      data.payments = payments.slice(0, months);
      db.murabaha[idx] = data;
    }
  } else {
    data.id = uid();
    data.payments = Array.from({ length: months }, () => ({ paid: false }));
    db.murabaha.push(data);
  }
  saveDB();
  closeModal();
  renderMurabaha();
}

function showMurabahaSchedule(id) {
  const m = db.murabaha.find(x => x.id === id);
  if (!m) return;
  const totalMarkup = m.price * (m.markupPercent / 100) * m.months;
  const total = m.price + totalMarkup;
  const monthly = (total - m.downPayment) / m.months;
  const schedule = (m.payments || []).map((p, i) => `
    <div class="schedule-item ${p.paid ? 'paid' : ''}">
      <span>${i + 1}-й платёж · ${fmt(monthly)} ₽</span>
      <button class="btn ${p.paid ? 'btn-outline' : 'btn-success'} btn-sm" onclick="togglePayment('${id}',${i})">
        ${p.paid ? '✓ Оплачен' : 'Отметить'}
      </button>
    </div>`).join('');
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <h2>График: ${m.item}</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="text-sm text-muted mb-8">Покупатель: ${m.buyer || '—'}</div>
    ${schedule}
    <button class="btn btn-primary btn-block mt-8" onclick="whatsappMurabaha('${id}')">Напомнить в WhatsApp</button>`;
  openModal();
}

function togglePayment(id, idx) {
  const m = db.murabaha.find(x => x.id === id);
  if (m && m.payments[idx]) {
    m.payments[idx].paid = !m.payments[idx].paid;
    saveDB();
    showMurabahaSchedule(id);
    renderMurabaha();
  }
}

function whatsappMurabaha(id) {
  const m = db.murabaha.find(x => x.id === id);
  if (!m) return;
  const totalMarkup = m.price * (m.markupPercent / 100) * m.months;
  const total = m.price + totalMarkup;
  const monthly = (total - m.downPayment) / m.months;
  const nextIdx = (m.payments || []).findIndex(p => !p.paid);
  const msg = encodeURIComponent(
    `Ассаламу алейкум, ${m.buyer || ''}!\n\nНапоминание по рассрочке (мурабаха):\nТовар: ${m.item}\nСледующий платёж: ${fmt(monthly)} ₽${nextIdx >= 0 ? ' (№' + (nextIdx + 1) + ')' : ''}\n\nС уважением, AutoTrade`
  );
  const phone = (m.phone || '').replace(/\D/g, '');
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}

function deleteMurabaha(id) {
  if (!confirm('Удалить сделку?')) return;
  db.murabaha = db.murabaha.filter(x => x.id !== id);
  saveDB();
  renderMurabaha();
}

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalIfOverlay(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `autotrade_backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.settings) throw new Error('Неверный формат файла');
      if (!confirm('Заменить ВСЕ текущие данные загруженным файлом?')) return;
      db = { ...defaultData(), ...data };
      ['suppliers','cars','goods','debts','murabaha'].forEach(k => {
        if (!Array.isArray(db[k])) db[k] = [];
      });
      saveDB();
      updateRateDisplay();
      renderAll();
      alert('Данные успешно загружены');
    } catch (err) {
      alert('Ошибка импорта: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function clearAllData() {
  if (!confirm('Удалить ВСЕ данные без возможности восстановления?')) return;
  if (!confirm('Точно? Это необратимо.')) return;
  db = defaultData();
  saveDB();
  updateRateDisplay();
  renderAll();
  alert('База полностью очищена');
}
